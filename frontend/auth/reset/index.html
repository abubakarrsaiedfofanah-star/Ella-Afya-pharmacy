<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account Recovery — Ella Afya Pharmacy</title><link rel="stylesheet" href="./style.css"></head><body class="auth-page"><main class="auth-panel"><div class="auth-panel-inner"><div class="mobile-brand"><img class="brand-logo" src="../../shared/assets/ella-afya-mark.png" alt=""><strong>Ella Afya Pharmacy</strong></div><div class="form-heading"><span class="eyebrow">ACCOUNT RECOVERY</span><h1 id="title">Reset your password</h1><p id="subtitle">We will send a secure recovery link if the account exists.</p></div><form id="requestForm"><label>Email address<input id="email" type="email" autocomplete="email" required placeholder="name@pharmacy.com"></label><button class="auth-btn" type="submit">Send recovery link</button></form><form id="updateForm" style="display:none"><label>New password<div class="password-field"><input id="newPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><button type="button" class="eye" id="togglePassword" aria-label="Show password">◉</button></div></label><button class="auth-btn" type="submit">Update password</button></form><p id="msg" class="form-message" role="status" aria-live="polite"></p><div class="register-card"><div><strong>Remembered your password?</strong><p>Return to secure login.</p></div><a href="/auth/" class="secondary-btn">Back to login</a></div></div></main><script src="../../shared/js/config.js"></script><script type="module" src="./app.js"></script></body></html>
