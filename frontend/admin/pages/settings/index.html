<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pharmacy Settings</title><link rel="stylesheet" href="../../../shared/css/base.css"><link rel="stylesheet" href="./style.css"></head><body><div class="shell"><aside class="sidebar"><div class="brand"><img class="brand-mark" src="/shared/assets/ella-afya-mark.png" alt="Ella Afya Pharmacy"><div><h2>Ella Afya</h2><small>Admin Control Center</small></div></div><nav class="nav"><a href="/admin/">Dashboard</a><a class="active" href="/admin/pages/settings/">Pharmacy Settings</a><a href="/admin/pages/reconciliation/">End-of-Day</a><a href="/admin/pages/sessions/">Devices and Sessions</a><a href="/admin/pages/security/">Security</a></nav></aside><div class="nav-backdrop" aria-hidden="true"></div><main class="content"><header class="page-head"><div><small>BUSINESS CONFIGURATION</small><h1>Pharmacy Settings</h1><p class="muted">These values appear on receipts and guide operational alerts.</p></div></header><section class="card"><form id="form" class="form-grid"><label>Pharmacy name<input name="pharmacy_name" required></label><label>Tagline<input name="tagline"></label><label>Phone<input name="phone"></label><label>Email<input name="email" type="email"></label><label>Address<input name="address"></label><label>Till number<input name="till_number"></label><label>PayBill number<input name="paybill_number"></label><label>PayBill account number<input name="paybill_account_number" value="427459"></label><label>Currency<input name="currency" required></label><label>Low-stock threshold<input name="low_stock_threshold" type="number" min="0"></label><label>Expiry alert days<input name="expiry_alert_days" type="number" min="1" max="365"></label><label class="full">Receipt footer<textarea name="receipt_footer"></textarea></label><button class="btn" type="submit">Save pharmacy settings</button></form><p id="msg" role="status" aria-live="polite"></p></section></main></div><script src="../../../shared/js/config.js"></script><script type="module" src="./app.js"></script><script src="../../../shared/js/ui.js"></script></body></html>
