<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b705d"><title>Medicine Inventory</title><link rel="stylesheet" href="../../../shared/css/base.css"><link rel="stylesheet" href="./style.css"></head>
<body><div class="shell"><aside class="sidebar"><div class="brand"><img class="brand-mark" src="/shared/assets/ella-afya-mark.png" alt="Ella Afya Pharmacy"><div><h2>Ella Afya</h2><small>Admin Control Center</small></div></div><nav class="nav"><a href="/admin/">Dashboard</a><a class="active" href="/admin/pages/inventory/">Inventory</a><a href="/admin/pages/receiving/">Stock Receiving</a><a href="/admin/pages/alerts/">Alerts</a><a href="/admin/pages/reports/">Reports</a></nav></aside><main class="content"><header class="page-head"><div><small>ADMIN ONLY</small><h1>Medicine Inventory</h1></div></header>
<section class="card"><h2>Add a medicine</h2><form id="form" class="form-grid"><input name="name" placeholder="Medicine name" required><input name="generic_name" placeholder="Generic name"><input name="brand" placeholder="Brand"><input name="manufacturer" placeholder="Manufacturer"><input name="barcode" placeholder="Barcode / SKU"><input name="strength" placeholder="Strength e.g. 500mg"><input name="dosage_form" placeholder="Dosage form e.g. tablet"><input name="quantity" type="number" min="0" step="1" value="0" placeholder="Opening quantity" required><input name="batch_number" placeholder="Opening batch number (required when quantity is above 0)"><input name="expiry_date" type="date" aria-label="Opening batch expiry date"><input name="purchase_price" type="number" min="0" step="0.01" placeholder="Buying price" required><input name="selling_price" type="number" min="0" step="0.01" placeholder="Selling price" required><input name="min_stock" type="number" min="0" step="1" placeholder="Minimum stock"><input name="reorder_level" type="number" min="0" step="1" placeholder="Reorder level"><label><input name="prescription_required" type="checkbox"> Prescription required</label><label><input name="controlled_medicine" type="checkbox"> Controlled medicine</label><button class="btn" type="submit">Add medicine</button></form><p id="msg" role="status" aria-live="polite"></p></section>
<section class="card csv-import"><div class="page-head"><div><small>BULK CATALOGUE SETUP</small><h2>Import medicines from Excel or CSV</h2></div><button class="btn secondary" id="downloadTemplate" type="button">Download CSV template</button></div><label class="csv-file-label" for="csvFile">Choose Excel or CSV file</label><input id="csvFile" type="file" accept=".csv,.xlsx,.xls,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel"><p id="csvMsg" role="status" aria-live="polite"></p><div id="csvPreview" class="table-wrap" hidden></div><button id="importCsv" class="btn" type="button" disabled>Import medicines</button></section>
<section class="card" id="medicineCatalog"><div class="toolbar"><input id="search" placeholder="Search by name, generic or barcode..." aria-label="Search medicines"><select id="filter" aria-label="Filter medicines"><option value="active" selected>Active</option><option value="inactive">Inactive</option><option value="all">All</option><option value="low">Low stock</option><option value="out">Out of stock</option><option value="rx">Prescription only</option></select></div><p id="catalogMsg" role="status" aria-live="polite"></p><div class="table-wrap"><table class="table"><thead><tr><th>Medicine</th><th>Barcode</th><th>Form</th><th>Buying price</th><th>Selling price</th><th>Quantity</th><th>Reorder</th><th>Rx</th><th>Controlled</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div><div class="catalog-clear"><button id="clearCatalog" class="btn danger" type="button">Clear catalogue for next import</button></div></section></main></div><script src="../../../shared/js/config.js"></script><script type="module" src="./app.js"></script><script src="../../../shared/js/ui.js"></script></body></html>
