<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Ella Afya Pharmacy</title>
  <desc id="desc">E and A initials with a pharmacy cross and leaf on a deep green emblem.</desc>
  <defs>
    <linearGradient id="tile" x1="8" y1="4" x2="88" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#188b72"/>
      <stop offset="1" stop-color="#063b34"/>
    </linearGradient>
    <linearGradient id="gold" x1="28" y1="28" x2="72" y2="76" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe29a"/>
      <stop offset="1" stop-color="#efb842"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#052d26" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect x="3" y="3" width="90" height="90" rx="28" fill="url(#tile)"/>
  <rect x="5" y="5" width="86" height="86" rx="26" fill="none" stroke="#d9fff2" stroke-opacity=".25" stroke-width="1.5"/>
