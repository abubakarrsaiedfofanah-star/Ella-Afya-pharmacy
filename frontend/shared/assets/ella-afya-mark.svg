    <text x="48" y="61" fill="#f5fbf8" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="700" letter-spacing="-2" text-anchor="middle">E&amp;A</text>
  </g>
  <path d="M30 73h26" fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-width="2.5"/>
  <path d="M63 76c1-7 6-11 14-12-1 8-5 13-13 14m1-2 8-8" fill="none" stroke="#8fe0bf" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
